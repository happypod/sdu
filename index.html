<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffcb05" />
    <meta name="description" content="QR코드 만들기와 URL 단축. 링크 공유를 더 간편하게 만드는 두 가지 도구." />
    <title>URL2QR — 링크를 더 간편하게</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="gradient.js" defer></script>
  </head>
  <body>
    <div class="ambient-gradient" id="ambient-gradient" aria-hidden="true"></div>
    <header class="site-header">
      <a class="brand" href="./" aria-label="URL2QR 처음으로"><img src="img/logo.png" width="306" height="79" alt="URL2QR" /></a>
      <span class="header-caption">작은 링크, 쉬운 공유</span>
    </header>
    <main class="tool-home">
      <section class="home-content" aria-labelledby="home-heading">
        <div class="introduction">
          <span class="eyebrow"><span class="eyebrow-line" aria-hidden="true"></span> SIMPLE LINK TOOLS</span>
          <h1 id="home-heading">링크 공유, <span class="heading-accent">더 간편하게.</span></h1>
          <p>QR코드로 만들거나, 짧은 주소로 바꿔 보세요.</p>
        </div>
        <div class="tool-cards">
          <a class="tool-card" href="url2qr/index.html" aria-label="QR코드">
            <span class="tool-icon qr-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="10" height="10" rx="1"/><rect x="19" y="3" width="10" height="10" rx="1"/><rect x="3" y="19" width="10" height="10" rx="1"/><path d="M19 19h4v4h6v6H19v-6m10-4v4M7 7h2v2H7zm16 0h2v2h-2zM7 23h2v2H7z"/></svg></span>
            <h2>QR코드</h2>
            <p>링크를 담은 QR코드를 만들고<br />JPG 이미지로 저장하세요.</p>
            <span class="card-action" aria-hidden="true">QR코드 만들기 <span>↗</span></span>
          </a>
          <a class="tool-card short-card" href="urlShort/index.html" aria-label="URL단축">
            <span class="tool-icon short-icon" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m13 19 6-6m-8 9-2 2a5.7 5.7 0 0 1-8-8l7-7a5.7 5.7 0 0 1 8 0m0 14a5.7 5.7 0 0 0 8 0l7-7a5.7 5.7 0 0 0-8-8l-2 2" transform="translate(1 0) scale(.93)"/></svg></span>
            <h2>URL단축</h2>
            <p>길고 복잡한 주소를 짧게 바꾸고<br />클릭 한 번으로 복사하세요.</p>
            <span class="card-action" aria-hidden="true">URL 단축하기 <span>↗</span></span>
          </a>
        </div>
        <p class="home-note">필요한 도구를 선택해 바로 시작하세요.</p>
      </section>
    </main>
    <footer class="site-footer"><span>URL2QR</span><span>링크 하나로, 더 가까이.</span></footer>
  </body>
</html>
